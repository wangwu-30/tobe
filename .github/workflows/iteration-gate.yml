name: Iteration Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: iteration-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  iteration-gate:
    name: iteration-gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: .tmp/playwright-browsers

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run iteration gate
        run: npm run verify:iteration

      - name: Upload failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iteration-regression-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/iteration-regression/artifacts/
          if-no-files-found: warn
          retention-days: 14
